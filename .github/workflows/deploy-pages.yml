name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [deploy/landing]
  # Lets a game-only change (no site diff) trigger a redeploy without an
  # empty commit here — the workflow always pulls signal_loss's current
  # main regardless of what triggered it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site (deploy/landing)
        uses: actions/checkout@v4

      - name: Checkout game source (main)
        uses: actions/checkout@v4
        with:
          repository: aeon022/signal_loss
          ref: main
          path: signal_loss-game

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Test the game
        run: go test ./...
        working-directory: signal_loss-game

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build WASM game
        run: npm run build:wasm
        env:
          SIGNAL_LOSS_DIR: ${{ github.workspace }}/signal_loss-game

      - run: npm run build

      # Real browser, built page and WASM: both languages load, a first choice
      # works, a death is counted. A broken game never reaches Pages.
      - name: Smoke test
        run: |
          npx astro preview --port 4321 &
          for i in $(seq 30); do curl -sf http://localhost:4321/signal_loss/ >/dev/null && break; sleep 1; done
          npm run smoke
        env:
          CHROME_BIN: google-chrome

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
